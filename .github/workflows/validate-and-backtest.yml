name: Validate tickers and run backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Backtest start date"
        default: "2012-01-01"
      split:
        description: "Out-of-sample starts on"
        default: "2020-01-01"
  schedule:
    - cron: "0 3 2 * *"    # monthly, 2nd of the month

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Check every ticker maps to the right company
        run: python -m engine.verify_universe
      - name: Backtest all model variants
        run: python -m engine.backtest --start "${{ github.event.inputs.start || '2012-01-01' }}" --split "${{ github.event.inputs.split || '2020-01-01' }}"
      - name: Save report
        run: |
          git config user.name "tase-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "Backtest $(date -u +%F)"
          git pull --rebase
          git push
