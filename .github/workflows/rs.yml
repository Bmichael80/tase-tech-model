name: Relative strength study

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: RS study
        run: python -m engine.rs_study --start 2012-01-01 --split 2020-01-01
      - name: Save report
        run: |
          git config user.name "tase-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "RS study $(date -u +%F)"
          git pull --rebase
          git push
