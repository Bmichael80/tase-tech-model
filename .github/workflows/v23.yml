      - name: Write inst_patch.py
        run: |
          mkdir -p $(dirname inst_patch.py)
          cat > inst_patch.py <<'PATCHEOF'
          """Runs the quantitative fundamental score (engine/fundq.py) at the end of the weekly run. Idempotent."""
          from pathlib import Path

          p = Path("engine/run.py")
          s = p.read_text(encoding="utf8")
          anchor = '        print("  data problem:", e["ticker"], e["name"], "; ".join(e["issues"]))\n'
          add = ('    if not args.offline:\n'
                 '        try:\n'
                 '            from . import fundq\n'
                 '            fundq.main()\n'
                 '        except Exception as e:  # the technical results are already saved\n'
                 '            print("quantitative fundamentals skipped:", e)\n')
          if "fundq.main()" not in s:
              assert s.count(anchor) == 1, "anchor not found in engine/run.py"
              s = s.replace(anchor, anchor + add, 1)
          p.write_text(s, encoding="utf8")
          print("engine/run.py patched")
          PATCHEOF
      - name: Add to the weekly run
        run: python inst_patch.py && rm inst_patch.py
      - name: Unit tests
        run: python -m pytest -q
      - name: Score all companies from their financial statements
        run: python -m engine.fundq
      - name: Save to the repository
        run: |
          git config user.name "tase-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add engine/fundq.py engine/run.py tests/test_fundq.py results/fundq
          git diff --cached --quiet || git commit -m "Quantitative fundamental score (Q1)"
          git pull --rebase
          git push

