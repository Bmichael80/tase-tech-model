name: Resolve and verify tickers

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Resolve tickers by ISIN
        run: python -m engine.resolve_tickers
      - name: Save report
        run: |
          git config user.name "tase-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "Ticker resolution $(date -u +%F)"
          git pull --rebase
          git push
